# ABOUTME: Defines the profile generator's Python environment and checks.
# ABOUTME: Runtime uses the standard library; development tools are locked by uv.
[project]
name = "research-profile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mypy", "ruff"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["profile/generate.py", "tests"]
