# ABOUTME: Validate the profile generator and its GitHub Actions workflows.
# ABOUTME: Keep pull-request checks read-only and independent of live feeds.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Install workflow linter
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check
        run: scripts/check
