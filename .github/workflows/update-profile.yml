# ABOUTME: Refresh the public organization profile daily from GitHub and RSS.
# ABOUTME: Publish a commit only when generated profile content changes.
name: Update profile

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: Run generator tests
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python profile/generate.py
      - name: Commit changed content
        run: |
          if git diff --quiet -- profile/README.md; then
            echo 'Profile content is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- profile/README.md
          git commit -m 'chore: refresh organization profile'
          git push
